services:
  redis:
    image: redis:7-alpine
    container_name: maker-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.0
    container_name: maker-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: maker
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: maker-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc rm -r --force myminio/maker-assets || true;
      /usr/bin/mc mb myminio/maker-assets;
      /usr/bin/mc anonymous set download myminio/maker-assets;
      exit 0;
      "

  # Fase 5 - pipeline de estruturacao (classificacao, validacao de BOM, auditoria).
  # Chamado via HTTP pelo worker BullMQ (lib/ml-pipeline.ts); o app principal continua
  # funcionando normalmente se esse servico estiver fora do ar.
  ml-pipeline:
    build: ./ml-pipeline
    container_name: maker-ml-pipeline
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/maker
    depends_on:
      - mysql

volumes:
  redis-data:
  mysql-data:
  minio-data:
