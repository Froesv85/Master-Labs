; Teste da tela do Nodo — ESP32-S3-DevKitC-1 N16R8
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi     ; flash QIO + PSRAM octal (N16R8)
board_upload.flash_size = 16MB
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1                 ; Serial pela porta USB nativa
  -DBOARD_HAS_PSRAM
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ILI9341
